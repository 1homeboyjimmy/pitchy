<!DOCTYPE html>

<html class="dark" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<style>
        body {
            background-color: #0A0A0A;
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>

<body class="text-on-surface min-h-screen flex flex-col font-body-sm">
<!-- TopNavBar Suppressed as per context (Linear/Transactional flow) -->
<main class="flex-1 flex items-center justify-center p-md">
<!-- Verification Card -->
<div class="w-full max-w-md bg-[#111111] border border-white/10 rounded-lg p-xl backdrop-blur-md relative overflow-hidden group">
<!-- Hover effect base -->
<div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none" style="background: radial-gradient(600px circle at 50% 0%, rgba(255,255,255,0.03), transparent 40%);"></div>
<div class="relative z-10 flex flex-col items-center text-center">
<!-- Lock Icon -->
<div class="mb-lg p-md bg-white/5 rounded border border-white/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[32px] font-light" data-icon="lock" style="font-variation-settings: 'wght' 200;">lock</span>
</div>
<h1 class="font-h1 text-h1 text-primary mb-sm tracking-tight">Подтвердите почту</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl max-w-[280px]">
                    Мы отправили 6-значный код на ваш email.
                </p>
<!-- 6-Digit Input Form -->
<form class="w-full flex flex-col gap-lg">
<div class="flex justify-between gap-sm">
<!-- Input 1 -->
<input aria-label="Digit 1" class="w-12 h-14 bg-[#111111] border border-white/10 rounded text-center text-primary font-code text-[20px] focus:border-white/40 focus:ring-0 transition-colors" maxlength="1" type="text"/>
<!-- Input 2 -->
<input aria-label="Digit 2" class="w-12 h-14 bg-[#111111] border border-white/10 rounded text-center text-primary font-code text-[20px] focus:border-white/40 focus:ring-0 transition-colors" maxlength="1" type="text"/>
<!-- Input 3 -->
<input aria-label="Digit 3" class="w-12 h-14 bg-[#111111] border border-white/10 rounded text-center text-primary font-code text-[20px] focus:border-white/40 focus:ring-0 transition-colors" maxlength="1" type="text"/>
<!-- Input 4 -->
<input aria-label="Digit 4" class="w-12 h-14 bg-[#111111] border border-white/10 rounded text-center text-primary font-code text-[20px] focus:border-white/40 focus:ring-0 transition-colors" maxlength="1" type="text"/>
<!-- Input 5 -->
<input aria-label="Digit 5" class="w-12 h-14 bg-[#111111] border border-white/10 rounded text-center text-primary font-code text-[20px] focus:border-white/40 focus:ring-0 transition-colors" maxlength="1" type="text"/>
<!-- Input 6 -->
<input aria-label="Digit 6" class="w-12 h-14 bg-[#111111] border border-white/10 rounded text-center text-primary font-code text-[20px] focus:border-white/40 focus:ring-0 transition-colors" maxlength="1" type="text"/>
</div>
<button class="w-full py-md bg-primary text-[#0A0A0A] font-body-sm text-body-sm font-medium rounded hover:opacity-90 transition-opacity flex justify-center items-center h-12" type="submit">
                        Подтвердить
                    </button>
</form>
<!-- Resend Link -->
<div class="mt-lg">
<button class="font-code text-code text-[#888888] hover:text-white transition-colors uppercase tracking-widest border-b border-transparent hover:border-white/20 pb-xs" type="button">
                        Отправить код повторно
                    </button>
</div>
</div>
</div>
</main>
</body></html>
