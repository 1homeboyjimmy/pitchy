mode: iptables
pid_dir: /var/run/
update_frequency: 10s
daemonize: false
log_mode: stdout
log_level: info
api_url: ${API_URL}
api_key: ${CROWDSEC_BOUNCER_API_KEY}
disable_ipv6: false
deny_action: DROP
deny_log: true
deny_log_prefix: "crowdsec: "
# if set to true, the bouncer will not fail if it cannot connect to the API on startup
# but will keep retrying. This is useful when the API is not yet available.
# Actually, we want it to retry.
retry_initial_connect: true
