name: Deploy Dev (Staging)

on:
  push:
    branches: [ dev ]

# Раннеры self-hosted иногда отваливаются между джобами: 25.07 build-frontend
# отработал на ru-vmmedium, а build-backend так и не получил раннера и провисел
# в очереди часами, блокируя deploy. Без группы каждый следующий пуш вставал в
# ту же очередь за мёртвым раном. Теперь новый пуш в dev снимает предыдущий —
# деплой идемпотентен (reset --hard + compose up --force-recreate + миграции),
# поэтому обрыв на середине лечится следующим прогоном.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend (dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          provenance: false
          tags: ${{ env.BACKEND_IMAGE }}:dev,${{ env.BACKEND_IMAGE }}:dev-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=dev-backend
          cache-to: type=gha,mode=max,scope=dev-backend

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend (dev)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          pull: true
          provenance: false
          tags: ${{ env.FRONTEND_IMAGE }}:dev,${{ env.FRONTEND_IMAGE }}:dev-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://dev.pitchy.pro
            BACKEND_INTERNAL_URL=http://backend:8000
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=dev-frontend
          cache-to: type=gha,mode=max,scope=dev-frontend

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-backend, build-frontend]
    steps:
      - name: Deploy to staging over SSH
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USERNAME: ${{ secrets.DEV_USERNAME }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'rm -f ~/.ssh/dev_deploy_key' EXIT
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/dev_deploy_key
          chmod 600 ~/.ssh/dev_deploy_key
          ssh-keyscan -H "$DEV_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/dev_deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=120 \
              "$DEV_USERNAME@$DEV_HOST" \
              "GITHUB_TOKEN='$GH_TOKEN' GITHUB_ACTOR='$GH_ACTOR' IMAGE_TAG='$RELEASE_SHA' bash -s" <<'REMOTE_SCRIPT'
          set -e
          cd /opt/ai-startup

          # Compose-file selection now lives in env so we don't have to
          # sprinkle -f flags everywhere. Staging layers the small override
          # file on top of the prod base; COMPOSE_PROFILES intentionally
          # NOT set so the security-profile services (crowdsec + firewall
          # bouncer) stay off on dev.
          export COMPOSE_FILE="docker-compose.yml:docker-compose.staging.yml"
          export CADDYFILE="Caddyfile.staging"

          # Login to GHCR
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          # Ensure repo is writable by current user (some files may have been
          # created by root via earlier sudo runs)
          if [ -w .git/logs/refs/heads/dev ] 2>/dev/null; then :; else
            sudo -n chown -R "$(id -u):$(id -g)" /opt/ai-startup 2>/dev/null || \
              chown -R "$(id -u):$(id -g)" /opt/ai-startup 2>/dev/null || true
          fi
          # Reclaim disposable Docker cache/old images before Git writes its
          # shallow-lock file. Running containers and data volumes are kept.
          docker builder prune -af || true
          docker image prune -af --filter until=168h || true
          # Pull latest code
          # Keep the exception process-local: ~/.gitconfig may be read-only on
          # the deploy host and must not be needed for a release.
          git -c safe.directory=/opt/ai-startup fetch --no-tags --depth=1 origin dev
          git -c safe.directory=/opt/ai-startup reset --hard origin/dev

          # Pull new images
          docker compose pull -q || echo "WARNING: Some images failed to pull"

          # Restart services
          timeout 180 docker compose up -d --force-recreate --remove-orphans

          # Wait for postgres
          for i in $(seq 1 10); do
            if docker compose exec -T postgres pg_isready -U app_user -d app </dev/null; then
              echo "Postgres is ready."
              break
            fi
            echo "Waiting for postgres... ($i/10)"
            sleep 2
          done

          # Migrations must succeed AND land at HEAD. The old "|| continuing"
          # let two migrations sit unapplied for days before being caught
          # by 500s on the dependent endpoints. Fail loud — the workflow
          # turns red, and the issue is fixed before users see it.
          if ! timeout 60 docker compose exec -T backend python -m alembic upgrade head </dev/null; then
            echo "ERROR: alembic upgrade head exited non-zero on dev"
            exit 1
          fi
          CURRENT_REV=$(docker compose exec -T backend python -m alembic current </dev/null 2>/dev/null | grep -oE '[a-f0-9]{12}' | head -n 1 || true)
          HEAD_REV=$(docker compose exec -T backend python -m alembic heads </dev/null 2>/dev/null | grep -oE '[a-f0-9]{12}' | head -n 1 || true)
          if [ -z "$CURRENT_REV" ] || [ -z "$HEAD_REV" ] || [ "$CURRENT_REV" != "$HEAD_REV" ]; then
            echo "ERROR: alembic revision mismatch — current=$CURRENT_REV, head=$HEAD_REV"
            exit 1
          fi
          echo "Migrations OK — alembic at $CURRENT_REV"

          # One-time rich-event backfill for the parser rollout. The marker is
          # kept outside Git tracking on the staging host, so future deploys do
          # not repeat paid source extraction. Admins can rerun it from the UI.
          mkdir -p .deploy-state
          if [ ! -f .deploy-state/unicornroad-rich-events-v1.done ]; then
            echo "Running one-time Unicorn Road event backfill..."
            if ! timeout 900 docker compose exec -T backend python -c "import asyncio, json; from unicornroad_parser import crawl_unicornroad; print(json.dumps(asyncio.run(crawl_unicornroad(sections=['event'], max_per_section=1000, force_refresh=True, active_only=True)), ensure_ascii=False))" </dev/null; then
              echo "ERROR: Unicorn Road event backfill failed"
              exit 1
            fi
            touch .deploy-state/unicornroad-rich-events-v1.done
            echo "Unicorn Road event backfill complete."
          fi

          # Healthcheck
          health_ok="false"
          for i in $(seq 1 30); do
            body="$(docker compose exec -T backend curl -s http://127.0.0.1:8000/health </dev/null || true)"
            if echo "$body" | grep -q '"status":"ok"'; then
              health_ok="true"
              echo "Healthcheck passed on attempt $i!"
              break
            fi
            echo "Healthcheck attempt $i: ${body:-<empty>}"
            sleep 5
          done

          if [ "$health_ok" != "true" ]; then
            echo "DEPLOY FAILED: healthcheck timeout"
            docker compose logs backend --tail=50
            exit 1
          fi

          # Cleanup
          docker image prune -af 2>/dev/null || true
          echo "Staging deploy successful!"
          REMOTE_SCRIPT

          rm -f ~/.ssh/dev_deploy_key
