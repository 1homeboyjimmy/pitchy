name: Deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  # ВАЖНО: убедись, что репозиторий в нижнем регистре (pitchy)
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # Объединяем всё в один джоб на твоем сервере, чтобы избежать платных проверок GitHub
  build-and-deploy:
    runs-on: self-hosted  # <--- ИСПОЛЬЗУЕМ ТОЛЬКО ТВОЙ МОЩНЫЙ СЕРВЕР
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://pitchy.pro
            BACKEND_INTERNAL_URL=http://backend:8000

      - name: Deploy over SSH to Main Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            export GITHUB_ACTOR=${{ github.actor }}
            cd /opt/ai-startup
            git fetch origin
            git reset --hard origin/main
            chmod +x deploy.sh
            ./deploy.sh