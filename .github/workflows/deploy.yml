name: Deploy

on:
  push:
    branches: [ main ]

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Приводим к нижнему регистру для совместимости с Docker
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  test-accelerator-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run accelerator backend integration tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: accelerator-tests
          push: false
          provenance: false
          cache-from: type=gha,scope=prod-backend

  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          pull: true
          provenance: false
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=prod-backend
          cache-to: type=gha,mode=max,scope=prod-backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          pull: true
          provenance: false
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://pitchy.pro
            BACKEND_INTERNAL_URL=http://backend:8000
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=prod-frontend
          cache-to: type=gha,mode=max,scope=prod-frontend

  deploy:
    runs-on: ubuntu-latest
    needs: [test-accelerator-backend, build-backend, build-frontend]
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'rm -f ~/.ssh/prod_deploy_key' EXIT
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/prod_deploy_key
          chmod 600 ~/.ssh/prod_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/prod_deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=120 \
              "$VPS_USER@$VPS_HOST" \
              "GITHUB_TOKEN='$GH_TOKEN' GITHUB_ACTOR='$GH_ACTOR' IMAGE_TAG='$RELEASE_SHA' bash -s" <<'REMOTE_SCRIPT'
          set -e
          cd /opt/ai-startup

          # Ensure repo is writable by current user (some files may have been
          # created by root via earlier sudo runs)
          if [ -w .git/logs/refs/heads/main ] 2>/dev/null; then :; else
            sudo -n chown -R "$(id -u):$(id -g)" /opt/ai-startup 2>/dev/null || \
              chown -R "$(id -u):$(id -g)" /opt/ai-startup 2>/dev/null || true
          fi
          git config --global --add safe.directory /opt/ai-startup

          git fetch origin
          git reset --hard origin/main
          chmod +x deploy.sh
          ./deploy.sh
          REMOTE_SCRIPT

          rm -f ~/.ssh/prod_deploy_key
