services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  chroma:
    image: chromadb/chroma:latest
    environment:
      IS_PERSISTENT: "true"
      PERSIST_DIRECTORY: /chroma/chroma
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"

  backend:
    build: .
    depends_on:
      - postgres
      - redis
      - chroma
    environment:
      APP_ENV: dev
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@postgres:5432/app}
      REDIS_URL: redis://redis:6379/0
      CHROMA_HTTP_HOST: chroma
      CHROMA_HTTP_PORT: 8000
      CHROMA_REINDEX: ${CHROMA_REINDEX:-false}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
      AUDIENCE_SEARCH_CONTEXT_SIZE: ${AUDIENCE_SEARCH_CONTEXT_SIZE:-high}
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      POLZA_API_BASE: ${POLZA_API_BASE:-https://polza.ai/api/v1}
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:-}
      ROUTERAI_API_BASE: ${ROUTERAI_API_BASE:-https://routerai.ru/api/v1}
      ROUTERAI_RERANK_MODEL: ${ROUTERAI_RERANK_MODEL:-cohere/rerank-v3.5}
      POLZA_EMBEDDING_MODEL: ${POLZA_EMBEDDING_MODEL:-qwen/qwen3-embedding-4b}
    env_file:
      - .env
    volumes:
      - ./:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      BACKEND_INTERNAL_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  frontend_node_modules:
