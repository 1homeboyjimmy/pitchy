name: Renew configurable subscriptions

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due renewals
        env:
          BILLING_CRON_SECRET: ${{ secrets.BILLING_CRON_SECRET }}
        run: |
          if [ -z "$BILLING_CRON_SECRET" ]; then
            echo "BILLING_CRON_SECRET is not set in GitHub Secrets; skipping. Server cron can run renewals instead."
            exit 0
          fi
          curl --fail-with-body --retry 2 --max-time 60 \
            -X POST https://pitchy.pro/billing/renewals/run \
            -H "X-Cron-Secret: $BILLING_CRON_SECRET"
