<!DOCTYPE html>

<style>
        body { background-color: #0A0A0A; }
        .hairline-border { border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-focus:focus { border-color: rgba(255, 255, 255, 0.4); outline: none; box-shadow: none; }
    </style>

<body class="text-on-background min-h-screen flex items-center justify-center p-md relative overflow-hidden">
<!-- Visualization Background -->
<div class="absolute inset-0 z-0 flex items-center justify-center overflow-hidden pointer-events-none [mask-image:radial-gradient(circle,white_20%,transparent_80%)]">
<img alt="AI Point Cloud Visualization" class="w-full h-full object-cover object-center opacity-40 mix-blend-screen" src="https://lh3.googleusercontent.com/aida/ADBb0ugz33rXftnCLjTsUMl8LieoiTQdeMLUCU7M5GpeuBGF4JPwBrcGMtexVFKxgb-uElgA-nqWYey3hZxWtJBEff6klejL4atIxifq0FBMNXuM74eZDMmQqzgu4j42peoITX-t5l9ITR5mfn3ICLRW5205DA5nZJBKUqr66UKWvM2gvw5qETUi-BJPcBOmw7tUOVinekEq3e01cgMNe56vni6BSl4Ze0qjvn7cEYz3F1u_2ofdZe2H2lIsvKg"/>
</div>
<div class="w-full max-w-[400px] relative z-10">
<!-- Brand / Header -->
<div class="text-center mb-xl">
<h1 class="font-display text-display text-primary tracking-tighter mb-sm">PITCHY.PRO</h1>
<p class="font-code text-code text-[#888888] uppercase">Создание аккаунта системы</p>
</div>
<!-- Registration Form Card -->
<div class="bg-[#111111] hairline-border p-lg">
<form action="#" class="space-y-lg" method="POST">
<!-- Name Field -->
<div>
<label class="block font-mono-label text-mono-label text-[#888888] uppercase mb-sm" for="name">Имя</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-[#444444] text-[18px]">person</span>
<input class="w-full bg-[#111111] hairline-border text-primary font-body-sm text-body-sm pl-xl py-sm input-focus placeholder-[#444444]" id="name" name="name" placeholder="Иван Иванов" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-mono-label text-mono-label text-[#888888] uppercase mb-sm" for="email">Email адрес</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-[#444444] text-[18px]">mail</span>
<input class="w-full bg-[#111111] hairline-border text-primary font-body-sm text-body-sm pl-xl py-sm input-focus placeholder-[#444444]" id="email" name="email" placeholder="user@domain.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-mono-label text-mono-label text-[#888888] uppercase mb-sm" for="password">Пароль</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-[#444444] text-[18px]">key</span>
<input class="w-full bg-[#111111] hairline-border text-primary font-body-sm text-body-sm pl-xl py-sm input-focus placeholder-[#444444]" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Confirm Password Field -->
<div>
<label class="block font-mono-label text-mono-label text-[#888888] uppercase mb-sm" for="password_confirm">Подтверждение пароля</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-[#444444] text-[18px]">key</span>
<input class="w-full bg-[#111111] hairline-border text-primary font-body-sm text-body-sm pl-xl py-sm input-focus placeholder-[#444444]" id="password_confirm" name="password_confirm" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-body-sm text-body-sm font-medium py-sm hover:opacity-90 transition-opacity flex justify-center items-center gap-sm" type="submit">
                    Зарегистрироваться
                </button>
</form>
<!-- Divider -->
<div class="flex items-center my-lg">
<div class="flex-grow border-t border-white/[0.08]"></div>
<span class="mx-md font-mono-label text-mono-label text-[#444444]">ИЛИ</span>
<div class="flex-grow border-t border-white/[0.08]"></div>
</div>
<!-- SSO Options -->
<div class="space-y-sm">
<!-- Yandex -->
<button class="w-full bg-transparent hairline-border text-primary font-body-sm text-body-sm py-sm hover:bg-white/[0.05] transition-colors flex items-center justify-center gap-sm" type="button">
<span class="material-symbols-outlined text-[18px]">login</span>
                    Продолжить с Яндекс
                </button>
<!-- Google -->
<button class="w-full bg-transparent hairline-border text-primary font-body-sm text-body-sm py-sm hover:bg-white/[0.05] transition-colors flex items-center justify-center gap-sm" type="button">
<span class="material-symbols-outlined text-[18px]">account_circle</span>
                    Продолжить с Google
                </button>
<!-- GitHub -->
<button class="w-full bg-transparent hairline-border text-primary font-body-sm text-body-sm py-sm hover:bg-white/[0.05] transition-colors flex items-center justify-center gap-sm" type="button">
<span class="material-symbols-outlined text-[18px]">terminal</span>
                    Продолжить с GitHub
                </button>
</div>
</div>
<!-- Footer / Helper -->
<div class="text-center mt-lg">
<p class="font-code text-code text-[#888888]">Уже есть аккаунт? <a class="text-primary hover:underline underline-offset-4 decoration-white/30" href="#">Войти</a></p>
</div>
</div>
</body></html>
