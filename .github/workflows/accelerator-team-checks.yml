name: Accelerator team checks

on:
  pull_request:
    paths:
      - 'accelerator_team_*.py'
      - 'routers/accelerator_teams.py'
      - 'schemas/accelerator_teams.py'
      - 'models.py'
      - 'alembic/versions/**'
      - 'tests/test_accelerator_teams.py'
      - '.github/workflows/accelerator-team-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-team-transfers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resident_test
          POSTGRES_PASSWORD: resident_local_test
          POSTGRES_DB: team_transfer_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U resident_test -d team_transfer_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the actual backend runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          load: true
          push: false
          provenance: false
          tags: pitchy-team-checks:local
          cache-from: type=gha,scope=prod-backend
      - name: Verify consent, rollback and concurrent transfers on PostgreSQL
        run: |
          docker run --rm --network host --entrypoint python \
            -e PYTHON_DOTENV_DISABLED=1 -e OPENAI_API_KEY=local-test-only -e POLZA_API_KEY=local-test-only \
            -e PITCHY_TEST_DATABASE_URL=postgresql+psycopg2://resident_test:resident_local_test@127.0.0.1:55432/team_transfer_test \
            pitchy-team-checks:local -m pytest tests/test_accelerator_teams.py tests/test_accelerator_resident_import.py -o addopts="-ra --tb=short" -q
